name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Full-tree scan, not a diff. The previous diff-based version used
      #   [ -f "$f" ] && bash scripts/secret-scan.sh "$f" || exit 2
      # which false-FAILS on any DELETED path: `[ -f ]` is false, the && short-circuits,
      # and the || fires exit 2. That made CI red on every deletion-bearing push. The
      # guard was redundant anyway - scan_file already returns 0 for a missing path.
      # Scanning the whole tree also deletes the pull_request / push / first-push branching.
      #
      # NOTE: this job is DETECTION, not a gate. On a push event it runs after the objects
      # are already on the public remote. See docs/SECURITY-secret-chain.md.
      # Enumerated into an array and called DIRECTLY - deliberately not `| xargs -0`.
      # xargs reports its OWN exit status for any non-zero child (BSD 1, GNU 123), which
      # collapsed the scanner's two distinct failure modes into one indistinguishable red:
      # rc=2 "a secret is in the tree - rotate the credential now" and rc=3 "the scanner
      # could not prove the tree clean - go fix the scanner". MEASURED 2026-08-03 on BSD
      # xargs: a child exiting 3 and a child exiting 2 both surfaced as 1.
      #
      # Scope this honestly: xargs runs EVERY batch even after one fails (also measured),
      # so no file was ever skipped and the job was red in both cases. This is a diagnosis
      # defect, not a coverage one - but the two reds demand opposite human responses, and
      # "rotate a production credential" is not a thing to leave ambiguous.
      #
      # Batched at 500 so a large tree cannot hit ARG_MAX. Precedence is 3 > 2 > 0: a run
      # that both found a secret and failed to scan something reports the could-not-scan,
      # because the unscanned part may hide worse. Bash-only (arrays) - fine here, this file
      # only ever runs on ubuntu-latest. NOTE `${files[@]:i:500}` is a hard PARSE error in
      # zsh; it must never be copied into a .sh file, several of which are probed under zsh.
      #
      # THE ENUMERATION GOES THROUGH A FILE, NOT `< <(git ls-files -z)`. The first version of
      # this rewrite used process substitution and was a COVERAGE REGRESSION against the very
      # `| xargs` form it replaced - caught by an adversarial review and then reproduced:
      # with a git that emits 2 of 3 paths and dies (exit 141), the pipe form went red at 141
      # because pipefail surfaces a dying producer, while the process-substitution form
      # printed "clean (2 tracked files scanned)" and exited 0 with an unscanned secret in
      # the tree. `set -euo pipefail` does NOT cover `< <(...)`: its exit status is
      # structurally unobservable. scripts/secret-scan.sh already states this rule in its own
      # comments; this step had to learn it the same way twice, so it is now mechanical.
      # A partial enumeration is the dangerous shape - the old `-eq 0` guard only ever caught
      # a TOTAL failure, which is the one case that was already obvious.
      - name: Run native scanner (full tree)
        run: |
          set -euo pipefail
          chmod +x scripts/secret-scan.sh
          enum=$(mktemp)
          trap 'rm -f "$enum"' EXIT
          if ! git ls-files -z > "$enum"; then
            echo "secret-scan CI: git ls-files FAILED (rc=$?) - enumeration is incomplete, refusing to report clean" >&2
            exit 3
          fi
          # A NUL-terminated stream must end in a NUL. If it does not, the producer was cut
          # off mid-path and `read -r -d ''` silently discards that final record - measured:
          # a stream ending `...\0zz-secret.txt` reported "clean (2 scanned)" and dropped it.
          if [ -s "$enum" ] && [ "$(tail -c 1 "$enum" | od -An -tu1 | tr -d ' \n')" != "0" ]; then
            echo "secret-scan CI: enumeration stream is truncated (no trailing NUL) - refusing to report clean" >&2
            exit 3
          fi
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < "$enum"
          # A tree with zero tracked files means enumeration broke, not that the repo is
          # clean. Fail closed rather than report a green scan of nothing.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "secret-scan CI: git ls-files enumerated NO tracked files - refusing to report clean" >&2
            exit 3
          fi
          worst=0
          i=0
          while [ "$i" -lt "${#files[@]}" ]; do
            rc=0
            # `--` marks end-of-options: a tracked file literally named "--staged" would
            # otherwise switch the scanner into staged mode and scan nothing at all.
            bash scripts/secret-scan.sh -- "${files[@]:i:500}" || rc=$?
            case "$rc" in
              0) ;;
              2) [ "$worst" -eq 3 ] || worst=2 ;;
              *) worst=3 ;;
            esac
            i=$((i + 500))
          done
          case "$worst" in
            0) echo "secret-scan CI: clean (${#files[@]} tracked files scanned)" ;;
            2) echo "secret-scan CI: SECRET DETECTED (rc=2) - rotate the exposed credential at the provider" >&2 ;;
            *) echo "secret-scan CI: COULD NOT PROVE CLEAN (rc=3) - investigate the scanner; do NOT assume a leak, and do NOT assume there isn't one" >&2 ;;
          esac
          exit "$worst"

      # THE PROOF SUITE ITSELF (added 2026-08-03, round-2 review). Until this step existed,
      # scripts/hooks/test-secret-scan.sh ran ONLY when a human typed the command: every
      # fail-closed behaviour it asserts could regress and ship green. It also never ran on
      # Linux/bash5/GNU - the platform the scanner's own comments contrast against, and the
      # one where a BSD-vs-GNU assumption would actually break. The suite is hermetic (it
      # builds its own fixture repos under mktemp) and assembles every secret-shaped fixture
      # at RUNTIME, so no secret-like literal is committed to make it work.
      #
      # `</dev/null` and timeout-minutes are BOTH load-bearing, not boilerplate. The suite
      # drives stale-handoff-guard.sh, which begins `HOOK_JSON=$(cat)` - it blocks forever on
      # an inherited stdin that never reaches EOF. Reproduced: with an open pipe on stdin the
      # suite hangs indefinitely; with </dev/null it exits promptly. A hung job is neither
      # green nor red, so without these the gate's own regression net could report nothing
      # at all - a guard that cannot reach its target reporting success, one level up.
      - name: Run the secret-scan proof suite
        timeout-minutes: 10
        run: bash scripts/hooks/test-secret-scan.sh </dev/null

      # PINNED TO A COMMIT SHA, not the `v2` tag it used to carry. `v2` is a tag the action's
      # publisher can re-point at any commit, and this step runs third-party code in our CI
      # with `secrets.GITHUB_TOKEN` in its environment - so a moved tag is remote code
      # execution against this repo, with no diff on our side to review. RESOLVED 2026-08-03:
      # refs/tags/v2 is an annotated tag object dereferencing to commit ff98106, which is
      # exactly what v2.3.9 points at. Note the project has already shipped v3.0.0, so `v2`
      # is a stale floating pointer, not a maintained release line.
      #
      # Upgrading is a DELIBERATE act: re-resolve the tag, read the diff, then move this SHA
      # and the trailing comment together. The comment is the only human-readable record of
      # which version the SHA is.
      - name: Run gitleaks (battle-tested second opinion)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
