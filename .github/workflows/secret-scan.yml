name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Full-tree scan, not a diff. The previous diff-based version used
      #   [ -f "$f" ] && bash scripts/secret-scan.sh "$f" || exit 2
      # which false-FAILS on any DELETED path: `[ -f ]` is false, the && short-circuits,
      # and the || fires exit 2. That made CI red on every deletion-bearing push. The
      # guard was redundant anyway - scan_file already returns 0 for a missing path.
      # Scanning the whole tree also deletes the pull_request / push / first-push branching.
      #
      # NOTE: this job is DETECTION, not a gate. On a push event it runs after the objects
      # are already on the public remote. See docs/SECURITY-secret-chain.md.
      - name: Run native scanner (full tree)
        run: |
          set -euo pipefail
          chmod +x scripts/secret-scan.sh
          # `--` marks end-of-options: a tracked file literally named "--staged" would
          # otherwise switch the scanner into staged mode and scan nothing at all.
          git ls-files -z | xargs -0 bash scripts/secret-scan.sh --

      # THE PROOF SUITE ITSELF (added 2026-08-03, round-2 review). Until this step existed,
      # scripts/hooks/test-secret-scan.sh ran ONLY when a human typed the command: every
      # fail-closed behaviour it asserts could regress and ship green. It also never ran on
      # Linux/bash5/GNU - the platform the scanner's own comments contrast against, and the
      # one where a BSD-vs-GNU assumption would actually break. The suite is hermetic (it
      # builds its own fixture repos under mktemp) and assembles every secret-shaped fixture
      # at RUNTIME, so no secret-like literal is committed to make it work.
      - name: Run the secret-scan proof suite
        run: bash scripts/hooks/test-secret-scan.sh

      - name: Run gitleaks (battle-tested second opinion)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
