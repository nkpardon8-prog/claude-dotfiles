name: Lint Commands

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout on purpose. Unlike secret-scan.yml (fetch-depth: 0, because
      # gitleaks scans history), these lints in --all mode read the WORKING TREE only:
      # the --staged index query short-circuits in --all, so no history is needed.
      - name: Checkout
        uses: actions/checkout@v4

      # Both lints shell out to python3 to count CHARACTERS (not bytes) - that is how the
      # 20,000-char re-injection ceiling is defined. The dependency is load-bearing and,
      # in one of the two, silent when unmet:
      #   lint-skill-contract.sh fails CLOSED (its first_pos has a `|| echo -1` fallback,
      #     so a dead python3 surfaces as a contract violation - exit 1).
      #   lint-skill-size.sh ALSO fails closed now (2026-08-03). It previously failed OPEN,
      #     and this comment described that defect in the present tense long after it was
      #     fixed - a doc-vs-code drift an agent would faithfully act on. Both halves are
      #     closed today: a MISSING python3 is caught by a preflight in the script itself
      #     (exit 3), and a PER-FILE measurement failure - an unreadable or undecodable
      #     guarded file, which the preflight cannot see - now yields -1 and fails the lint
      #     rather than leaving `n` empty and degrading to "integer expression expected".
      # A green build that measured nothing is worse than a red one, so this step still
      # asserts the interpreter FUNCTIONALLY - `command -v` would pass a stub that cannot
      # run, and the script-level preflight is a second layer, not a replacement.
      - name: Preflight - python3 must be present AND working
        id: preflight
        run: |
          set -euo pipefail
          python3 --version
          probe=$(python3 -c "print(len('abc'))")
          if [ "$probe" != "3" ]; then
            echo "Preflight FAIL: python3 did not evaluate correctly (got '$probe', want '3')." >&2
            echo "lint-skill-size.sh would silently pass without checking anything." >&2
            exit 1
          fi

      # Invoked through an explicit `bash` rather than executing the file directly. Both
      # scripts need real bash (${BASH_SOURCE[0]} for the ROOT split, process substitution
      # in the size lint), and this pins the interpreter regardless of the file's exec bit
      # or the runner's /bin/sh (dash on Ubuntu). No chmod needed - unlike secret-scan.sh,
      # both lint scripts are tracked mode 100755, and `bash <file>` ignores the exec bit.
      #
      # --all is the phase-gate/CI mode: it checks every rule unconditionally instead of
      # only the staged set. Ordering mirrors the generated pre-commit hook
      # (scripts/install-git-hooks.sh: size first, then contract).
      #
      # WHY THIS WORKFLOW EXISTS: the pre-commit hook is the only other invocation path,
      # and it is bypassable with `git commit --no-verify` and simply absent on a fresh
      # clone until install-git-hooks.sh is run.
      #
      # CI is the LAST line, not a NON-BYPASSABLE one - the earlier wording claimed the
      # latter and docs/SECURITY-secret-chain.md contradicts it directly. On a `push` event
      # this job runs AFTER the objects are already on the remote, so it DETECTS rather than
      # PREVENTS; and with no branch protection configured, a red run blocks nothing by
      # itself. Treat a failure here as "this already shipped, go fix it", not as a gate.
      - name: lint-skill-size (--all)
        run: bash scripts/lint-commands/lint-skill-size.sh --all

      # Runs even when the size lint above failed, so one push reports BOTH lints instead
      # of hiding the second behind the first. Still gated on the preflight: there is no
      # point linting with a known-broken interpreter. Either failing step fails the job.
      - name: lint-skill-contract (--all)
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: bash scripts/lint-commands/lint-skill-contract.sh --all

      # Added 2026-08-03. This is the third lint in scripts/lint-commands/ and until now the
      # only one NO automated path invoked - not this workflow, and not the generated
      # pre-commit hook (which runs only the two lints that have a --staged mode). Its own
      # header asserted the repo had no CI at all, which had stopped being true.
      #
      # The explicit `.` is REQUIRED, not stylistic: the script's ROOT defaults to
      # $HOME/.claude-dotfiles, which does not exist on the runner. Omitting it does not
      # silently pass - the script's `[ -f "$F" ]` check exits 2 (verified against a fake
      # HOME before wiring this) - but it would be a confusing red for the wrong reason.
      #
      # Runs even if the lints above failed, for the same reason lint-skill-contract does:
      # one push should report every lint, not just the first to break.
      - name: lint-testplan
        if: ${{ !cancelled() }}
        run: bash scripts/lint-commands/lint-testplan.sh .

  # THE SHELL HARNESSES THEMSELVES (added 2026-08-03, mission part 3 "guard-integrity").
  # Until this job existed, NINE of the ten scripts/hooks/test-*.sh harnesses ran ONLY when
  # a human typed the command. That is how test-lint-skill-size.sh sat VACUOUS: it copied the
  # lint outside its own tree, so the lint's BASH_SOURCE-derived ROOT resolved to an unrelated
  # ancestor with no commands/, matched no files and exited 0 - four of its six cases asserted
  # rc=1 behaviour that was never exercised, and the suite reported all-green regardless. A
  # guard nobody runs is indistinguishable from a guard that passes.
  #
  # `</dev/null` is load-bearing, not boilerplate: several harnesses drive hooks that begin
  # `HOOK_JSON=$(cat)` and block forever on an inherited stdin. timeout-minutes bounds the
  # rest - a hung job is neither green nor red, which is the same bug class one level up.
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Listed EXPLICITLY rather than globbed. A glob would silently pick up a newly added
      # harness (good) but would also silently drop one that gets renamed (bad), and it would
      # hide which harnesses are deliberately excluded below.
      # EVERY harness runs, then the job fails with the full list. The first version used
      # `set -e` around the loop, which aborted on the first red and silently withdrew the
      # remaining harnesses from coverage - reproduced with a 3-item loop failing on #2:
      # item #3 never ran. That contradicted the principle stated two steps above in this
      # same file ("one push should report every lint, not just the first to break"), and it
      # mattered more here than there: this job is the ONLY automated path for these seven,
      # so one red harness took the other six offline while still looking like a normal
      # failure. NOTE the runner invokes every `run:` step as `bash -e {0}`, so `set -e` IS in
      # effect here no matter what the `set -uo pipefail` line says - an earlier version of this
      # comment claimed the step deliberately ran without it, which was simply false. What
      # actually keeps the loop alive is `|| rc=$?` absorbing each harness's failure. The
      # mechanism is the guard, not the absence of -e; stating the wrong reason is how the next
      # person "simplifies" the guard away.
      - name: Run shell harnesses
        run: |
          set -uo pipefail
          # ONLY harnesses PROVEN to pass in a CI layout (checkout not under $HOME, Linux).
          # The first version of this job listed seven and turned CI RED on every push from
          # the moment it landed - 16 consecutive failures before anyone looked, on a repo
          # that auto-pushes on every file edit. Cause: six of the seven resolve their target
          # as "$HOME/.claude-dotfiles/..." (HOME=/home/runner on a runner, checkout under
          # /home/runner/work) and/or use BSD-only `stat -f` / `date -v`, so they exited 127
          # or failed wholesale. That is precisely the "listed, not run" failure this job was
          # added to prevent, reproduced one level up - and it contradicted this file's own
          # exclusion rationale, which refuses to add a harness that "would redden CI for
          # everyone without fixing anything".
          #
          # Enrolling a harness here REQUIRES first proving it green with the checkout
          # OUTSIDE $HOME. test-lint-skill-size.sh qualified only after its $HOME hard-code
          # was replaced with a BASH_SOURCE-derived root.
          #
          # TWO INTERPRETERS, ONE LIST (2026-08-17). Two of the harnesses are PYTHON, and the
          # bash loop physically cannot run them: `bash test-prod-classifier-fixtures.py` does
          # not fail closed with a clean nonzero - it parses the file AS SHELL and emits
          # "import: command not found" for every import, then a syntax error. Measured. So the
          # loop dispatches on the extension rather than assuming one interpreter. They stay in
          # the SAME list and the SAME `failed` aggregate on purpose: a second step would split
          # the report in half and reintroduce, at the step level, exactly the "one red harness
          # hides the rest" bug the `|| rc=$?` guard below exists to prevent.
          # A missing python3 is NOT silently tolerated - it surfaces as rc=127 through the same
          # `|| rc=$?` path and fails the job, which is the fail-closed direction.
          failed=""
          for h in \
            scripts/hooks/test-chain-primitives.sh \
            scripts/hooks/test-lint-skill-size.sh \
            scripts/hooks/test-codex-build-chunk.sh \
            scripts/hooks/test-mission-doc-drift.sh \
            scripts/hooks/test-mission-pending-reask.sh \
            scripts/hooks/test-prod-classifier-fixtures.py \
            scripts/hooks/test-no-detach-fixtures.py ; do
            echo "=== $h ==="
            if [ ! -f "$h" ]; then
              # A renamed or deleted harness must not vanish from coverage quietly - that is
              # the same failure this job exists to prevent, one level up.
              echo "MISSING: $h - listed here but not on disk" >&2
              failed="$failed $h(missing)"
              continue
            fi
            rc=0
            case "$h" in
              *.py) python3 "$h" </dev/null || rc=$? ;;
              *)    bash    "$h" </dev/null || rc=$? ;;
            esac
            [ "$rc" -eq 0 ] || failed="$failed $h(rc=$rc)"
          done
          if [ -n "$failed" ]; then
            echo "FAILED harnesses:$failed" >&2
            exit 1
          fi
          echo "all harnesses green"

      # THE LIST ABOVE IS THE WHOLE INVENTORY MINUS THE LEDGER BELOW (2026-08-17). Before this
      # date the "listed EXPLICITLY, exclusions stay visible" principle stated at the top of this
      # step was only half kept: two harnesses ran, five were recorded as excluded, and SIX were
      # neither - absent from the list AND absent from the ledger, so nothing in the repo said
      # they existed. That silence is worse than a recorded gap: a recorded gap is a decision, an
      # unrecorded one is indistinguishable from an oversight, and two of the six were the proofs
      # for the highest-stakes surfaces in the repo. Every scripts/hooks/test-* file must now
      # appear EITHER in the loop above OR in the ledger below. Nothing else is acceptable.
      #
      # DELIBERATELY EXCLUDED, recorded rather than silently omitted:
      #   test-secret-scan.sh   - already run by secret-scan.yml; running it twice buys nothing.
      #   test-ctx-gate.sh      - RED at the time this job was added (1 failure: "phantom verbs
      #                           documented but never emitted"). Pre-existing and unrelated to
      #                           this mission; adding it would redden CI for everyone without
      #                           fixing anything. Tracked, not silently dropped.
      #
      # RED ON LINUX ONLY - both fail for ONE shared root cause, measured 2026-08-17 in an
      # ubuntu:latest container, non-root uid 1001, checkout relocated outside a shadowed $HOME,
      # invoked exactly as the loop does (`bash "$h" </dev/null`, no arguments):
      #   test-mission-bridge.sh   - macOS 83 PASS / 0 FAIL, Linux RED (incl. "file_size - got
      #                              '  File: ...'", "banner bounded", "log rotation archive").
      #   test-mission-liveness.sh - macOS 21 PASS / 0 FAIL, Linux 10 PASS / 11 FAIL (most cases
      #                              print `mission-liveness.sh: line 59: [: File: "..."`).
      # ROOT CAUSE, one line, in PRODUCTION code rather than in the harnesses:
      #   `sz=$(stat -f %z "$f" 2>/dev/null || stat -c %s "$f" 2>/dev/null)`
      # This idiom looks portable and is not. On GNU coreutils `-f` means --file-system, so the
      # call does not merely fail - it PRINTS A FILESYSTEM DUMP TO STDOUT ("File: ..." / "Blocks:
      # ...") and then exits 1. The `2>/dev/null` silences nothing, because the dump is on stdout;
      # the `||` fallback then runs and APPENDS its answer to that dump inside the same command
      # substitution. The variable ends up holding both, and the next `[ "$sz" -gt N ]` throws.
      # A BSD-only utility that failed cleanly would be caught by the fallback; this one corrupts
      # the value while looking like it worked, which is why both harnesses are green on the
      # author's Mac and red on any runner.
      # THE FIX (deliberately NOT done here): put the GNU form FIRST, or add `>/dev/null` to the
      # BSD attempt, at scripts/hooks/mission-liveness.sh:58,125 and scripts/hooks/lib/
      # mission-bridge.sh:78,209,781 - and note the same shape also sits in lib/
      # auto-compact-sentinel.sh:291, lib/handoff-resolve.sh:56 and lib/post-compact-primer-
      # helpers.sh:88. That is a multi-site edit to the LIVE mission bridge, well past the
      # "small and clearly safe" bar this job's enrollment rule sets, and it is a correctness fix
      # in its own right rather than CI plumbing. Enroll both the moment it lands - they need
      # nothing else. (Two harness-level instances exist too - test-mission-liveness.sh:354
      # `stat -f %Lp` and test-mission-bridge.sh:727 `date -v` - but fixing only those leaves the
      # 11 SUT-driven failures untouched, so they are not a shortcut to enrollment.)
      # This supersedes the previous note, which claimed test-mission-bridge.sh was "RED at the
      # time this job was added (2 failures)" and owned by another session. Both halves had gone
      # stale: it is 83/0 green on macOS today and the attribution no longer applies. A stale
      # exclusion is a re-enrollment that never happens, so it is recorded here as MEASURED, with
      # the platform named - "green" with no platform attached is what hid this for months.
      #
      # NOT YET PORTABLE - these five were in the first version of this job and are the reason
      # it was red 16/16. Each is a REAL coverage gap, recorded here so it stays visible rather
      # than quietly forgotten. Every one needs the same treatment test-lint-skill-size.sh got:
      # derive the target from BASH_SOURCE instead of $HOME, and replace BSD-only utilities.
      # MEASURED on the runner (run 30880718877) and in a local relocated-checkout fixture:
      #   test-engine-header.sh       - greps $HOME/.claude-dotfiles/commands/codex-review.md;
      #                                 "No such file or directory", PASS: 0 FAIL: 1.
      #   test-handoff-smoke-check.sh - 6 passed / 3 failed; one case gets rc=127 ($HOME path).
      #   test-auto-compact.sh        - PASS: 73 FAIL: 17 on Linux; BSD-only `stat -f` at :52,:220.
      #   test-stale-handoff-guard.sh - PASS: 5 FAIL: 3; BSD-only `date -v` at :19.
      #   test-mission-drift-check.sh - rc=2 in a relocated checkout; also owned by the other
      #                                 concurrent session, so ATTRIBUTION applies as above.
      # Re-enroll a harness ONLY after proving it green with the checkout outside $HOME.
      #
      # THAT BAR IS NECESSARY BUT NOT SUFFICIENT - tightened 2026-08-17, after test-mission-
      # bridge.sh and test-mission-liveness.sh passed the outside-$HOME test on macOS (83/0 and
      # 21/0) and were still red on Linux. Reproduce the RUNNER, not just the relocation. All
      # four of these are load-bearing and each one caught something the others missed:
      #   1. checkout OUTSIDE a shadowed $HOME  - catches the $HOME/.claude-dotfiles hard-codes
      #   2. LINUX, not macOS                   - catches BSD-only stat/date (the two above)
      #   3. NON-ROOT                           - as root, chmod-based negative cases go SKIP or
      #                                           falsely pass; run as a normal uid or the proof
      #                                           is weaker than it reads
      #   4. the tools the runner actually has  - `jq` is preinstalled on ubuntu-latest, so a
      #                                           bare container without it produces FAKE reds.
      #                                           test-chain-primitives.sh reported 17/4 that way
      #                                           and is 21/0 with jq present; do not "fix" a
      #                                           harness against a container poorer than CI.
      # A local recipe that satisfies all four (docker is enough; no runner access needed):
      #   git clone --no-hardlinks <repo> /tmp/co
      #   docker run --rm -v /tmp/co:/src:ro ubuntu:latest bash -c '
      #     apt-get update -qq && apt-get install -y -qq git python3 jq
      #     useradd -m -u 1001 ci; cp -r /src /w2; chown -R ci /w2
      #     su ci -c "export HOME=/home/ci; cd /w2; bash scripts/hooks/<harness>.sh </dev/null"'
      # Never suppress stderr while doing this: a silenced failure reads as a confident pass.
