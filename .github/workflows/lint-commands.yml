name: Lint Commands

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout on purpose. Unlike secret-scan.yml (fetch-depth: 0, because
      # gitleaks scans history), these lints in --all mode read the WORKING TREE only:
      # the --staged index query short-circuits in --all, so no history is needed.
      - name: Checkout
        uses: actions/checkout@v4

      # Both lints shell out to python3 to count CHARACTERS (not bytes) - that is how the
      # 20,000-char re-injection ceiling is defined. The dependency is load-bearing and,
      # in one of the two, silent when unmet:
      #   lint-skill-contract.sh fails CLOSED (its first_pos has a `|| echo -1` fallback,
      #     so a dead python3 surfaces as a contract violation - exit 1).
      #   lint-skill-size.sh ALSO fails closed now (2026-08-03). It previously failed OPEN,
      #     and this comment described that defect in the present tense long after it was
      #     fixed - a doc-vs-code drift an agent would faithfully act on. Both halves are
      #     closed today: a MISSING python3 is caught by a preflight in the script itself
      #     (exit 3), and a PER-FILE measurement failure - an unreadable or undecodable
      #     guarded file, which the preflight cannot see - now yields -1 and fails the lint
      #     rather than leaving `n` empty and degrading to "integer expression expected".
      # A green build that measured nothing is worse than a red one, so this step still
      # asserts the interpreter FUNCTIONALLY - `command -v` would pass a stub that cannot
      # run, and the script-level preflight is a second layer, not a replacement.
      - name: Preflight - python3 must be present AND working
        id: preflight
        run: |
          set -euo pipefail
          python3 --version
          probe=$(python3 -c "print(len('abc'))")
          if [ "$probe" != "3" ]; then
            echo "Preflight FAIL: python3 did not evaluate correctly (got '$probe', want '3')." >&2
            echo "lint-skill-size.sh would silently pass without checking anything." >&2
            exit 1
          fi

      # Invoked through an explicit `bash` rather than executing the file directly. Both
      # scripts need real bash (${BASH_SOURCE[0]} for the ROOT split, process substitution
      # in the size lint), and this pins the interpreter regardless of the file's exec bit
      # or the runner's /bin/sh (dash on Ubuntu). No chmod needed - unlike secret-scan.sh,
      # both lint scripts are tracked mode 100755, and `bash <file>` ignores the exec bit.
      #
      # --all is the phase-gate/CI mode: it checks every rule unconditionally instead of
      # only the staged set. Ordering mirrors the generated pre-commit hook
      # (scripts/install-git-hooks.sh: size first, then contract).
      #
      # WHY THIS WORKFLOW EXISTS: the pre-commit hook is the only other invocation path,
      # and it is bypassable with `git commit --no-verify` and simply absent on a fresh
      # clone until install-git-hooks.sh is run.
      #
      # CI is the LAST line, not a NON-BYPASSABLE one - the earlier wording claimed the
      # latter and docs/SECURITY-secret-chain.md contradicts it directly. On a `push` event
      # this job runs AFTER the objects are already on the remote, so it DETECTS rather than
      # PREVENTS; and with no branch protection configured, a red run blocks nothing by
      # itself. Treat a failure here as "this already shipped, go fix it", not as a gate.
      - name: lint-skill-size (--all)
        run: bash scripts/lint-commands/lint-skill-size.sh --all

      # Runs even when the size lint above failed, so one push reports BOTH lints instead
      # of hiding the second behind the first. Still gated on the preflight: there is no
      # point linting with a known-broken interpreter. Either failing step fails the job.
      - name: lint-skill-contract (--all)
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' }}
        run: bash scripts/lint-commands/lint-skill-contract.sh --all

      # Added 2026-08-03. This is the third lint in scripts/lint-commands/ and until now the
      # only one NO automated path invoked - not this workflow, and not the generated
      # pre-commit hook (which runs only the two lints that have a --staged mode). Its own
      # header asserted the repo had no CI at all, which had stopped being true.
      #
      # The explicit `.` is REQUIRED, not stylistic: the script's ROOT defaults to
      # $HOME/.claude-dotfiles, which does not exist on the runner. Omitting it does not
      # silently pass - the script's `[ -f "$F" ]` check exits 2 (verified against a fake
      # HOME before wiring this) - but it would be a confusing red for the wrong reason.
      #
      # Runs even if the lints above failed, for the same reason lint-skill-contract does:
      # one push should report every lint, not just the first to break.
      - name: lint-testplan
        if: ${{ !cancelled() }}
        run: bash scripts/lint-commands/lint-testplan.sh .

  # THE SHELL HARNESSES THEMSELVES (added 2026-08-03, mission part 3 "guard-integrity").
  # Until this job existed, NINE of the ten scripts/hooks/test-*.sh harnesses ran ONLY when
  # a human typed the command. That is how test-lint-skill-size.sh sat VACUOUS: it copied the
  # lint outside its own tree, so the lint's BASH_SOURCE-derived ROOT resolved to an unrelated
  # ancestor with no commands/, matched no files and exited 0 - four of its six cases asserted
  # rc=1 behaviour that was never exercised, and the suite reported all-green regardless. A
  # guard nobody runs is indistinguishable from a guard that passes.
  #
  # `</dev/null` is load-bearing, not boilerplate: several harnesses drive hooks that begin
  # `HOOK_JSON=$(cat)` and block forever on an inherited stdin. timeout-minutes bounds the
  # rest - a hung job is neither green nor red, which is the same bug class one level up.
  harnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Listed EXPLICITLY rather than globbed. A glob would silently pick up a newly added
      # harness (good) but would also silently drop one that gets renamed (bad), and it would
      # hide which harnesses are deliberately excluded below.
      # EVERY harness runs, then the job fails with the full list. The first version used
      # `set -e` around the loop, which aborted on the first red and silently withdrew the
      # remaining harnesses from coverage - reproduced with a 3-item loop failing on #2:
      # item #3 never ran. That contradicted the principle stated two steps above in this
      # same file ("one push should report every lint, not just the first to break"), and it
      # mattered more here than there: this job is the ONLY automated path for these seven,
      # so one red harness took the other six offline while still looking like a normal
      # failure. Deliberately NOT `set -e` in this step - the per-harness rc is the signal.
      - name: Run shell harnesses
        run: |
          set -uo pipefail
          # ONLY harnesses PROVEN to pass in a CI layout (checkout not under $HOME, Linux).
          # The first version of this job listed seven and turned CI RED on every push from
          # the moment it landed - 16 consecutive failures before anyone looked, on a repo
          # that auto-pushes on every file edit. Cause: six of the seven resolve their target
          # as "$HOME/.claude-dotfiles/..." (HOME=/home/runner on a runner, checkout under
          # /home/runner/work) and/or use BSD-only `stat -f` / `date -v`, so they exited 127
          # or failed wholesale. That is precisely the "listed, not run" failure this job was
          # added to prevent, reproduced one level up - and it contradicted this file's own
          # exclusion rationale, which refuses to add a harness that "would redden CI for
          # everyone without fixing anything".
          #
          # Enrolling a harness here REQUIRES first proving it green with the checkout
          # OUTSIDE $HOME. test-lint-skill-size.sh qualified only after its $HOME hard-code
          # was replaced with a BASH_SOURCE-derived root.
          failed=""
          for h in \
            scripts/hooks/test-chain-primitives.sh \
            scripts/hooks/test-lint-skill-size.sh ; do
            echo "=== $h ==="
            if [ ! -f "$h" ]; then
              # A renamed or deleted harness must not vanish from coverage quietly - that is
              # the same failure this job exists to prevent, one level up.
              echo "MISSING: $h - listed here but not on disk" >&2
              failed="$failed $h(missing)"
              continue
            fi
            rc=0
            bash "$h" </dev/null || rc=$?
            [ "$rc" -eq 0 ] || failed="$failed $h(rc=$rc)"
          done
          if [ -n "$failed" ]; then
            echo "FAILED harnesses:$failed" >&2
            exit 1
          fi
          echo "all harnesses green"

      # DELIBERATELY EXCLUDED, recorded rather than silently omitted:
      #   test-secret-scan.sh   - already run by secret-scan.yml; running it twice buys nothing.
      #   test-ctx-gate.sh      - RED at the time this job was added (1 failure: "phantom verbs
      #                           documented but never emitted"). Pre-existing and unrelated to
      #                           this mission; adding it would redden CI for everyone without
      #                           fixing anything. Tracked, not silently dropped.
      #   test-mission-bridge.sh - RED at the time this job was added (2 failures) AND owned by
      #                           a different concurrent session actively editing the bridge.
      #                           Not this mission's to fix; see the mission PLAN's ATTRIBUTION.
